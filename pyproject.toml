[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clickless-automotive"
version = "0.1.0"
description = "Evidence-backed used-car recommendations"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.1,<4",
    "python-dotenv>=1.0,<2",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
data = ["pandas>=2.2,<3"]
graph = ["neo4j>=6,<7", "pyshacl>=0.30,<1", "rdflib>=7,<8"]
ml = [
    "scikit-learn>=1.5,<2",
    "sentence-transformers>=3,<6",
    "vaderSentiment>=3.3,<4",
]
crawl = ["playwright>=1.48,<2", "scrapy>=2.12,<3"]
dev = ["pytest>=8,<9"]
all = [
    "neo4j>=6,<7",
    "pandas>=2.2,<3",
    "playwright>=1.48,<2",
    "pyshacl>=0.30,<1",
    "rdflib>=7,<8",
    "scikit-learn>=1.5,<2",
    "sentence-transformers>=3,<6",
    "vaderSentiment>=3.3,<4",
]

[project.scripts]
clickless = "clickless.web:main"
clickless-build-data = "clickless.data.pipeline:main"
clickless-crawl = "clickless.crawlers.capture:main"
clickless-evaluate = "clickless.evaluation.runner:main"
clickless-analyze-evaluation = "clickless.evaluation.analyze:main"
clickless-audit-components = "clickless.evaluation.components:main"

[tool.setuptools.packages.find]
where = ["src"]
